<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src https://ntfy.sh; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Joga</title>
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="../style.css">
<style>
  main { text-align: center; }
  .qr { display: inline-block; background: #fff; border-radius: 16px; padding: 12px; line-height: 0; }
  .qr svg { width: 240px; height: 240px; }
  .small .qr svg { width: 120px; height: 120px; }
  #status { min-height: 1.6em; margin: 16px 0; }
  #shot img { max-width: 100%; max-height: 70vh; border-radius: 12px; cursor: pointer; }
  .row { display: flex; gap: 12px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  button, .link { background: none; border: 1px solid var(--blue); color: var(--blue); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; text-decoration: none; }
  button.primary { background: var(--blue); color: #0B0B0D; }
  label { color: var(--muted); font-size: .9rem; }
  .hidden { display: none; }
  .ok { color: var(--blue); }
</style>
</head>
<body>
<main>
  <img class="logo" src="../logo.svg" alt="">
  <h1>Joga</h1>

  <section id="pair">
    <p class="muted">No celular: Joga → nome do PC (canto de cima) → Parear PC.</p>
    <div class="qr" id="qr"></div>
    <p><label><input type="checkbox" id="remember"> Lembrar neste navegador</label></p>
  </section>

  <p id="status" class="muted">Esperando imagem...</p>

  <section id="shot" class="hidden">
    <img id="img" alt="Imagem recebida do celular" title="Clique para copiar">
    <div class="row">
      <button id="copy" class="primary hidden">Copiar</button>
      <a id="save" class="link" download>Salvar como...</a>
    </div>
  </section>

  <div class="row">
    <button id="showqr" class="hidden">Mostrar QR</button>
    <button id="reset">Novo QR</button>
  </div>

  <footer>As imagens chegam criptografadas e ficam só nesta aba. <a href="../privacidade.html">Privacidade</a></footer>
</main>
<script src="qrcode.js"></script>
<script src="joga.js"></script>
</body>
</html>
